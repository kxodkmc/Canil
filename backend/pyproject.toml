[project]
name = "resume-studio-backend"
version = "1.0.0"
description = "简历工作室后端：FastAPI + Tortoise ORM (SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tortoise-orm==1.1.7",
    "aiosqlite>=0.20",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
